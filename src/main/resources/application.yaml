server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  cloud:
    consul:
      host: ${URL_CONSUL:localhost}
      port: ${PORT_CONSUL:8500}
      discovery:
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        service-name: api-gateway

    gateway:
      server:
        webflux:
          # El límite por defecto de Reactor Netty para frames de WebSocket es 65536 bytes (64KB);
          # los chunks WebM de MediaRecorder de la ingesta de streaming lo superan y el gateway
          # cierra la conexión con code 1009 ("Max frame length exceeded"). Esta propiedad cubre
          # ambos sentidos del proxy WS: navegador -> gateway (HandshakeWebSocketService) y
          # gateway -> ffmpeg-manager (cliente Netty saliente), ambos configurados a partir de la
          # misma HttpClientProperties.Websocket.
          httpclient:
            websocket:
              max-frame-payload-length: 10485760

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedHeaders: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - PUT
                  - DELETE
                  - OPTIONS

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: identityservice
              uri: lb://ms-auth-identityservice
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - Jwt

            - id: eventcategory
              uri: lb://ms-event-category
              predicates:
                - Path=/api/v1/events/**,/api/v1/modality/**
              filters:
                - Jwt

            - id: enrollment
              uri: lb://ms-enrollment
              predicates:
                - Path=/api/v1/enrollments/**
              filters:
                - Jwt
              
            - id: scoring
              uri: lb://ms-scoring
              predicates:
                - Path=/api/v1/scoring/**
              filters:
                - Jwt
            - id: scheduling
              uri: lb://ms-scheduling
              predicates:
                - Path=/api/v1/scheduling/**
              filters:
                - Jwt

            - id: notification-streaming
              uri: lb://ms-notification-streaming
              predicates:
                - Path=/api/v1/stream/**
              filters:
                - Jwt

            - id: srs-whip-ingest
              uri: http://wd-srs-media-server:1985
              predicates:
                - Path=/rtc/v1/whip/**
              filters:
                # SRS (crossdomain on) ya agrega Access-Control-Allow-Origin; sin esto, el globalcors
                # de abajo lo duplica y el navegador rechaza la respuesta ("*, *" no es válido).
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

            - id: srs-api
              uri: http://wd-srs-media-server:1985
              predicates:
                - Path=/srs-api/**
              filters:
                - StripPrefix=1
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

            # Ingesta de cámara/pantalla por WebSocket (TCP puro): reemplaza el WHIP/WebRTC directo a
            # SRS porque el túnel de Cloudflare descarta el UDP de ICE. Reactor Netty detecta el
            # header "Upgrade: websocket" y reenvía como ws:// automáticamente a esta misma uri http://.
            - id: ffmpeg-ws-ingest
              uri: http://ffmpeg-manager:3000
              predicates:
                - Path=/ws/ingest/**

            - id: music-media
              uri: lb://ms-music-media
              predicates:
                - Path=/api/v1/music/**
              filters:
                - Jwt

            - id: reporting-analytics
              uri: lb://ms-reporting-analytics-service
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - Jwt

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted

security:
  jwt:
    secret-key: ${JWT_SECRET:F0bVQgRnuk6DRxooVWKaG0ndlgqEeI/4YXObXeOaR2Q=}